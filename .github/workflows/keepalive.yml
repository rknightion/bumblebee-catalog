name: keepalive

# GitHub auto-disables scheduled workflows after 60 days with no repository
# activity. A weekly empty commit keeps the osv-catalog cron alive even during
# long quiet periods upstream.

on:
  schedule:
    - cron: '17 3 * * 1'   # 03:17 UTC every Monday
  workflow_dispatch:

permissions: {}

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked] the step pushes with the checkout credentials
      - run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keepalive (keep scheduled workflows enabled)"
          git push
