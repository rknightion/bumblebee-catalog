name: Generate OSV exposure catalog

# Regenerates the Bumblebee OSV exposure catalog from the OSSF malicious-packages
# feed and publishes it as the `catalog-latest` release asset that endpoints fetch.
#
# Cadence: every 4h. The OSSF feed ingests new malicious packages roughly every
# 4-5h (~18 commits/day), so 4h keeps us within one ingest batch of upstream.

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      force_publish:
        description: 'Publish even if entry count drops >10% vs last-good'
        type: boolean
        default: false

permissions:
  contents: write          # create/update the catalog-latest release

concurrency:
  group: osv-catalog
  cancel-in-progress: false

env:
  BUMBLEBEE_REPO: perplexityai/bumblebee
  # Pinned: tools/osvcatalog was added AFTER the v0.1.1 tag, so we pin a commit
  # that contains it. This builds the GENERATOR only.
  BUMBLEBEE_SHA: 156df7a272c9fc6bdd74df04fdabbf99477214de
  # The RELEASE the fleet actually runs. Validation happens against THIS, not
  # against a main checkout: v0.1.2 accepts only schema 0.1.0 while main accepts
  # 0.1.0 and 0.2.0, so a catalog main loads happily can be rejected outright by
  # the deployed binary. Keep in step with BUMBLEBEE_VERSION in the
  # bumblebee-intune installer.
  BUMBLEBEE_RELEASE: 0.1.2
  # The schema_version endpoints can consume. NOT a free choice -- read the
  # docstring in ci/validate.py before touching it. Raising this ahead of the
  # deployed binary silently drops every catalog here from every scan.
  CATALOG_SCHEMA_VERSION: 0.1.0
  OUTPUT: osv-malicious.json

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo (CI scripts)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.58.0'

      - name: Checkout bumblebee (pinned)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
          repository: ${{ env.BUMBLEBEE_REPO }}
          ref: ${{ env.BUMBLEBEE_SHA }}
          path: bumblebee

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: bumblebee/go.mod

      - name: Build bumblebee (generator only)
        working-directory: bumblebee
        run: go build -o "$GITHUB_WORKSPACE/bin/bumblebee" ./cmd/bumblebee

      - name: Download the DEPLOYED release (validation target)
        run: |
          set -euo pipefail
          # Everything that decides "will endpoints accept this catalog" must be
          # answered by the binary the fleet actually runs, not by main.
          mkdir -p release
          base="https://github.com/${BUMBLEBEE_REPO}/releases/download/v${BUMBLEBEE_RELEASE}"
          tarball="bumblebee_${BUMBLEBEE_RELEASE}_linux_amd64.tar.gz"
          curl -fsSL "$base/$tarball" -o "release/$tarball"
          curl -fsSL "$base/checksums.txt" -o release/checksums.txt
          ( cd release && grep " ${tarball}\$" checksums.txt | sha256sum -c - )
          tar -xzf "release/$tarball" -C release
          release/bumblebee version

      - name: Sparse-checkout OSSF malicious-packages
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout --depth 1 \
            https://github.com/ossf/malicious-packages.git mp
          git -C mp sparse-checkout init --cone
          git -C mp sparse-checkout set osv/malicious
          git -C mp checkout
          echo "OSSF_SHA=$(git -C mp rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Generate catalog
        working-directory: bumblebee
        run: |
          set -euo pipefail
          go run ./tools/osvcatalog \
            -source "https://github.com/ossf/malicious-packages@${OSSF_SHA}" \
            -o "$GITHUB_WORKSPACE/$OUTPUT" \
            "$GITHUB_WORKSPACE/mp/osv/malicious/"

      - name: Download last-good (floor check)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p old
          gh release download catalog-latest --repo "$GITHUB_REPOSITORY" \
            -p "$OUTPUT" -D old || echo "no previous release yet"

      - name: Validate + write meta
        # force_publish goes via env rather than being interpolated into the
        # run block, matching extra-catalogs.yml (commit 304929c). Same
        # github-context-injection hygiene, applied here too.
        env:
          FORCE_PUBLISH: ${{ github.event.inputs.force_publish }}
        run: |
          set -euo pipefail
          force=()
          if [ "${FORCE_PUBLISH:-false}" = "true" ]; then force=(--force); fi
          just validate-catalog \
            --catalog "$OUTPUT" \
            --old "old/$OUTPUT" \
            --ossf-sha "$OSSF_SHA" \
            --bumblebee-sha "$BUMBLEBEE_SHA" \
            --target-schema "$CATALOG_SCHEMA_VERSION" \
            "${force[@]}"

      - name: Assert the catalog SET loads in the deployed binary
        run: |
          set -euo pipefail
          # The published assets are consumed together with the binary's own
          # bundled threat_intel in ONE directory, and bumblebee exits 2 on a
          # directory that mixes schema versions -- emitting no records at all,
          # so nothing downstream can alert. Prove the real combination loads.
          gh release download catalog-latest --repo "$GITHUB_REPOSITORY" \
            -p 'datadog-malicious.json' -p 'ghsa-malicious.json' -D peers || true
          args=(--binary release/bumblebee --bundled release/threat_intel --catalog "$OUTPUT")
          for p in peers/datadog-malicious.json peers/ghsa-malicious.json; do
            [ -f "$p" ] && args+=(--catalog "$p")
          done
          just assert-catalog-set "${args[@]}"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Positive-match self-test (catalog actually matches)
        run: |
          set -euo pipefail
          PKGVER=$(just make-fixture --catalog "$OUTPUT" --out fixture)
          echo "seeded fixture package: $PKGVER"
          # Match against the DEPLOYED release, not the main-commit build used
          # to generate the catalog. "main can match it" is not the question.
          release/bumblebee scan \
            --profile project --root fixture \
            --exposure-catalog "$OUTPUT" \
            --max-duration 2m \
            --output file --output-file scan.ndjson
          just assert-finding --ndjson scan.ndjson --seed-file fixture/seed.json

      - name: Publish catalog-latest release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view catalog-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create catalog-latest --repo "$GITHUB_REPOSITORY" \
              --latest --title "OSV exposure catalog (rolling)" \
              --notes "Auto-generated rolling Bumblebee exposure catalog from the OSSF malicious-packages feed. The tag is a moving pointer; see catalog-meta.json for provenance (generated_at, ossf_sha, bumblebee_sha, entry_count)."
          fi
          gh release upload catalog-latest --repo "$GITHUB_REPOSITORY" --clobber \
            "$OUTPUT" catalog-meta.json
          echo "Published $OUTPUT ($(python3 -c "import json;print(len(json.load(open('$OUTPUT'))['entries']))") entries)"
